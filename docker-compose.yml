services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: domi911
      POSTGRES_PASSWORD: domi911
      POSTGRES_DB: domi911
    ports:
      - "5432:5432"
    volumes:
      - domi911_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domi911 -d domi911"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  domi911_db_data:
