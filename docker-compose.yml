services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatdomi
      POSTGRES_PASSWORD: whatdomi
      POSTGRES_DB: whatdomi
    ports:
      - "5432:5432"
    volumes:
      - whatdomi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatdomi -d whatdomi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whatdomi_db_data:
