<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatDomi - Ingresa a tu negocio</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .tabs button {
        flex: 1;
        background: #eef1f0;
        color: var(--primary-dark);
      }
      .tabs button.active {
        background: var(--primary);
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WhatDomi</h1>
      <p>Pide domiciliarios para tu negocio, directo desde la web.</p>
      <p class="hint"><a href="admin.html">Tablero de administración</a> · <a href="courier/index.html">App del domiciliario</a></p>
    </header>

    <main>
      <section id="auth-section">
        <div class="tabs">
          <button type="button" id="tab-login" class="active">Ya tengo cuenta</button>
          <button type="button" id="tab-register">Registrar mi negocio</button>
        </div>

        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" required placeholder="tu@negocio.com" />
          </label>
          <label>
            Contraseña
            <input type="password" name="password" required />
          </label>
          <button type="submit">Ingresar</button>
        </form>
        <p id="login-status" class="status"></p>

        <form id="register-form" hidden>
          <label>
            Nombre del negocio
            <input type="text" name="name" required placeholder="Restaurante La Esquina" />
          </label>
          <label>
            Teléfono de contacto
            <input type="tel" name="phone" required placeholder="+57 300 000 0000" />
          </label>
          <label>
            Dirección del negocio
            <input type="text" name="address" required placeholder="Describe la ubicación, ej: frente al parque central" />
          </label>
          <p class="hint">
            La usamos como tu punto de recogida por defecto — la geocodificamos una sola vez al
            registrarte, y puedes cambiarla para un pedido puntual si alguna vez recoges desde otro
            lugar.
          </p>
          <label>
            Email
            <input type="email" name="email" required placeholder="tu@negocio.com" />
          </label>
          <label>
            Contraseña
            <input type="password" name="password" required minlength="8" placeholder="Al menos 8 caracteres" />
          </label>
          <button type="submit">Registrar mi negocio</button>
        </form>
        <p id="register-status" class="status"></p>
      </section>
    </main>

    <script>
      // Cambia esta URL si el backend corre en otro host/puerto (por ejemplo, en producción).
      window.WHATDOMI_API_URL = window.WHATDOMI_API_URL || "http://localhost:3000";
    </script>
    <script src="auth.js"></script>
  </body>
</html>
