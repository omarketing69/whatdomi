<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatDomi - Pedir domiciliario</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>WhatDomi</h1>
      <p>Solicita un domiciliario para tu negocio, sin pasar por WhatsApp.</p>
    </header>

    <main>
      <section id="business-section">
        <h2>1. Tu negocio</h2>
        <p class="hint">
          Esto se guarda una sola vez en este navegador. Si ya registraste tu negocio antes, se
          carga automáticamente.
        </p>
        <form id="business-form">
          <label>
            Nombre del negocio
            <input type="text" name="name" required placeholder="Restaurante La Esquina" />
          </label>
          <label>
            Teléfono
            <input type="tel" name="phone" required placeholder="+57 300 000 0000" />
          </label>
          <label>
            Dirección (opcional)
            <input type="text" name="address" placeholder="Cra 10 #20-30" />
          </label>
          <button type="submit">Guardar negocio</button>
        </form>
        <p id="business-status" class="status"></p>
      </section>

      <section id="order-section" hidden>
        <h2>2. Datos del domicilio</h2>
        <form id="order-form">
          <fieldset>
            <legend>Recogida</legend>
            <label>
              Dirección de recogida
              <input type="text" name="pickupAddress" required placeholder="Tu local" />
            </label>
            <div class="grid-2">
              <label>
                Latitud
                <input type="number" step="any" name="pickupLat" required />
              </label>
              <label>
                Longitud
                <input type="number" step="any" name="pickupLng" required />
              </label>
            </div>
            <button type="button" id="use-my-location">Usar mi ubicación actual</button>
          </fieldset>

          <fieldset>
            <legend>Entrega</legend>
            <label>
              Dirección de entrega
              <input type="text" name="dropoffAddress" required placeholder="Dirección del cliente" />
            </label>
            <div class="grid-2">
              <label>
                Latitud
                <input type="number" step="any" name="dropoffLat" required />
              </label>
              <label>
                Longitud
                <input type="number" step="any" name="dropoffLng" required />
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Cliente (opcional)</legend>
            <label>
              Nombre
              <input type="text" name="customerName" />
            </label>
            <label>
              Teléfono
              <input type="tel" name="customerPhone" />
            </label>
            <label>
              Notas
              <textarea name="notes" rows="2" placeholder="Ej: apto 302, timbre malo"></textarea>
            </label>
          </fieldset>

          <button type="submit">Solicitar domiciliario</button>
        </form>
      </section>

      <section id="tracking-section" hidden>
        <h2>3. Estado del pedido</h2>
        <div id="order-summary"></div>
      </section>
    </main>

    <script>
      // Cambia esta URL si el backend corre en otro host/puerto (por ejemplo, en producción).
      window.WHATDOMI_API_URL = window.WHATDOMI_API_URL || "http://localhost:3000";
    </script>
    <script src="app.js"></script>
  </body>
</html>
