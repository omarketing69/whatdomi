<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domi911 - Dashboard</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Leaflet vendorizado localmente (frontend/vendor/leaflet) en vez de un CDN: el
         negocio objetivo son ciudades pequeñas con conexiones modestas, y así el mapa
         no depende de que un tercero externo esté disponible en cada carga. -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <style>
      #map {
        height: 280px;
        border-radius: 8px;
        margin-top: 0.75rem;
        border: 1px solid var(--border);
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .top-bar button {
        background: #eef1f0;
        color: var(--primary-dark);
        padding: 0.4rem 0.8rem;
      }
      #big-request-btn {
        font-size: 1.1rem;
        padding: 1rem;
      }
      .courier-contact {
        background: #fdeee0;
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="top-bar" style="max-width: 560px; margin: 0 auto;">
        <div>
          <img src="assets/logo-mark.png" alt="Domi911" class="brand-logo" />
          <p class="hint" id="business-name"></p>
        </div>
        <button type="button" id="logout-btn">Cerrar sesión</button>
      </div>
    </header>

    <main>
      <section id="request-section">
        <h2>Pedir domiciliario</h2>
        <p class="hint" id="pickup-hint"></p>
        <button type="button" id="big-request-btn">🛵 Pedir domiciliario</button>

        <form id="quote-form" hidden>
          <label>
            Dirección de entrega
            <input type="text" name="dropoffAddress" required placeholder="Dirección del cliente" />
          </label>
          <label class="hint" style="flex-direction: row; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="override-pickup-check" style="width: auto;" />
            Recoger en un lugar distinto al registrado (solo para este pedido)
          </label>
          <label id="override-pickup-label" hidden>
            Dirección de recogida para este pedido
            <input type="text" name="pickupAddress" placeholder="Otra sucursal, otro punto de recogida..." />
          </label>
          <fieldset>
            <legend>Cliente (opcional)</legend>
            <label>
              Nombre
              <input type="text" name="customerName" />
            </label>
            <label>
              Teléfono
              <input type="tel" name="customerPhone" />
            </label>
            <label>
              Notas
              <textarea name="notes" rows="2" placeholder="Ej: apto 302, timbre malo"></textarea>
            </label>
          </fieldset>
          <fieldset>
            <legend>Cobro de la mercancía (opcional)</legend>
            <p class="hint">
              Esto es aparte de la tarifa del domicilio. Solo llénalo si el domiciliario también va a
              manejar el cobro del pedido en sí (la comida/producto).
            </p>
            <label>
              Valor de la mercancía
              <input type="number" step="any" min="0" name="merchandiseValue" placeholder="Ej: 45000" />
            </label>
            <label>
              ¿Quién cobra la mercancía?
              <select name="paymentMode">
                <option value="">No aplica / el cliente le paga directo al negocio</option>
                <option value="BUSINESS_REIMBURSES_COURIER">
                  El negocio recibe todo y le reembolsa su servicio al domiciliario
                </option>
                <option value="COURIER_COLLECTS_ON_DELIVERY">
                  El domiciliario paga la mercancía al recoger, y cobra todo al cliente al entregar
                </option>
              </select>
            </label>
          </fieldset>
          <button type="submit">Calcular tarifa</button>
          <button type="button" id="cancel-quote-form-btn">Cancelar</button>
        </form>
        <p id="quote-status" class="status"></p>
      </section>

      <section id="quote-section" hidden>
        <h2>Confirmar pedido</h2>
        <div id="quote-summary"></div>
        <div class="row-actions" style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
          <button type="button" id="confirm-order-btn">Confirmar y buscar domiciliario</button>
          <button type="button" id="cancel-order-btn">Cancelar</button>
        </div>
        <p id="confirm-status" class="status"></p>
      </section>

      <section id="tracking-section" hidden>
        <h2>Estado del pedido</h2>
        <div id="order-summary"></div>
        <div id="courier-contact" class="courier-contact" hidden></div>
        <button type="button" id="new-order-btn" hidden>Pedir otro domicilio</button>
      </section>

      <!-- Un solo mapa, compartido entre "domiciliarios cerca antes de asignar" (cotización)
           y "trayecto en vivo" (después de confirmar) — el mismo <div> se reutiliza en las dos
           fases en vez de crear un mapa de Leaflet nuevo cada vez. -->
      <section id="map-section" hidden>
        <h2>Mapa</h2>
        <div id="map"></div>
        <p class="hint" id="map-hint"></p>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script>
      // Cambia esta URL si el backend corre en otro host/puerto (por ejemplo, en producción).
      window.DOMI911_API_URL = window.DOMI911_API_URL || "http://localhost:3000";
    </script>
    <script src="dashboard.js"></script>
  </body>
</html>
